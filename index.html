<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brick Society</title>
        
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/home.css">
    </head>
    <body id="home">
        <video id="logobunny" autoplay="autoplay" muted loop>
          <source src="video/LogoBunnyCompressed.mp4" type="video/mp4">
        Your browser does not support the video tag.
        </video>
        <section id="pitch" class="container-fluid">
            <div class="logo">
                <img src="img/home/logo.svg" alt="Brick Society Logo" />
            </div>
            <div class="subhead">
                    <h2>
                        A design community focused on Craft, Wellness, and Mutual Aid
                    </h2>
            </div>

            <section class="container-fixed">
                <a class="realButton joinus" href="https://bricksociety.mn.co/share/euOvw-91daIusYTF?utm_source=manual" target="_blank">
                    <img src="img/home/joinus.png" alt="Join Us!"/>
                </a>
                <a class="realButton eventCalendar" href="https://luma.com/bricksociety" target="_blank">
                    <img src="img/home/EventCalendarShaded.png" alt="Event Calendar"/>
                </a>
                <a class="realButton learnMore" href="https://bricksociety.mn.co/landing/" target="_blank">
                    <img src="img/home/LearnMore.png" alt="Learn More"/>
                </a>
                 
            </section>
        </section>
        <footer>
            <section class="container-fixed">
                <p>©2026 to Infinity.</p>
            </section>
            
        </footer>
    </body>
</html>
